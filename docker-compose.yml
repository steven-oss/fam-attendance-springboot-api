services:
  postgres:
    image: postgres:16-alpine
    container_name: fam-attendance-postgres
    environment:
      POSTGRES_DB: fam_attendance
      POSTGRES_USER: fam
      POSTGRES_PASSWORD: fam_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fam -d fam_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
